name: NPM Release

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use for build and test"
        type: string
        required: false
        default: "22"
      working-directory:
        description: "Subdirectory where package.json is located"
        type: string
        required: false
        default: "."
      require-tests:
        description: "Require 'test' script in package.json and pass before release"
        type: boolean
        required: false
        default: true
      require-build:
        description: "Require 'build' script in package.json and pass before release"
        type: boolean
        required: false
        default: false
      run-docboot:
        description: "Docboot documentation validation gate (auto, true, false)"
        type: string
        required: false
        default: "auto"
      docboot-command:
        description: "Custom docboot or documentation validation command"
        type: string
        required: false
        default: ""
      publish-access:
        description: "NPM publish access (public or restricted)"
        type: string
        required: false
        default: "public"
      npm-tag:
        description: "NPM distribution tag (e.g. latest, beta, next)"
        type: string
        required: false
        default: "latest"
      registry-url:
        description: "NPM registry URL"
        type: string
        required: false
        default: "https://registry.npmjs.org"
      create-github-release:
        description: "Automatically create a GitHub Release with generated notes"
        type: boolean
        required: false
        default: true
    secrets:
      NPM_TOKEN:
        description: "Optional legacy NPM authentication token (fallback if Trusted Publishing is not used)"
        required: false

jobs:
  release:
    name: Validate & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    if: github.repository_owner == 'litepacks' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Litepacks release engine
        uses: actions/checkout@v4
        with:
          repository: litepacks/.github
          path: .litepacks-release-tools

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Verify lockfile & Install dependencies
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "::error::package-lock.json not found in ${{ inputs.working-directory }}! A clean lockfile is required for deterministic CI release."
            exit 1
          fi
          npm ci

      - name: Pre-Flight Validation (Tag, Package Sanity & Script Detection)
        id: preflight
        run: |
          node "$GITHUB_WORKSPACE/.litepacks-release-tools/scripts/release-tool.mjs" \
            --dir "." \
            --tag "$GITHUB_REF_NAME" \
            --stage pre-flight \
            --require-tests "${{ inputs.require-tests }}" \
            --require-build "${{ inputs.require-build }}" \
            --registry-url "${{ inputs.registry-url }}"

      - name: Run Lint
        if: steps.preflight.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run Typecheck
        if: steps.preflight.outputs.has_typecheck == 'true'
        run: npm run typecheck

      - name: Run Tests
        if: steps.preflight.outputs.has_test == 'true'
        run: npm test

      - name: Run Build
        if: steps.preflight.outputs.has_build == 'true'
        run: npm run build

      - name: Docboot Documentation Gate
        run: |
          node "$GITHUB_WORKSPACE/.litepacks-release-tools/scripts/release-tool.mjs" \
            --dir "." \
            --stage docboot \
            --run-docboot "${{ inputs.run-docboot }}" \
            --docboot-command "${{ inputs.docboot-command }}"

      - name: Validate NPM Package Pack
        run: |
          node "$GITHUB_WORKSPACE/.litepacks-release-tools/scripts/release-tool.mjs" \
            --dir "." \
            --stage pack

      - name: Check NPM Registry Duplicate Version
        id: registry_check
        run: |
          node "$GITHUB_WORKSPACE/.litepacks-release-tools/scripts/release-tool.mjs" \
            --dir "." \
            --stage registry-check \
            --registry-url "${{ inputs.registry-url }}"

      - name: Publish to NPM (Trusted Publishing / OIDC)
        id: publish
        if: steps.registry_check.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NODE_AUTH_TOKEN provided. Cleaning up empty _authToken from npm userconfig to enable OIDC Trusted Publishing..."
            if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" || true
            fi
            unset NODE_AUTH_TOKEN
          else
            echo "NODE_AUTH_TOKEN detected, using token authentication."
          fi
          echo "Publishing ${{ steps.preflight.outputs.pkg_name }}@${{ steps.preflight.outputs.pkg_version }} to npm..."
          npm publish --provenance --access "${{ inputs.publish-access }}" --tag "${{ inputs.npm-tag }}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: github_release
        if: inputs.create-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PKG_NAME: ${{ steps.preflight.outputs.pkg_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release for tag '$TAG' already exists. Skipping creation."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating GitHub Release for '$TAG'..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Job Summary
        if: always()
        run: |
          node "$GITHUB_WORKSPACE/.litepacks-release-tools/scripts/release-tool.mjs" \
            --dir "." \
            --tag "$GITHUB_REF_NAME" \
            --registry-url "${{ inputs.registry-url }}" \
            --run-docboot "${{ inputs.run-docboot }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
